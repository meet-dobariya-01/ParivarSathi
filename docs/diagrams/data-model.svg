  <text x="1140" y="550" class="field">• userId: ObjectId</text>
  <text x="1140" y="570" class="field">• familyId: ObjectId</text>
  <text x="1140" y="590" class="field">• memberId: ObjectId</text>
  <text x="1140" y="610" class="field">• applicationId: ObjectId</text>
  <text x="1140" y="630" class="field">• action: string</text>
  <text x="1140" y="650" class="field">• details: string</text>
  <text x="1140" y="670" class="field">• createdAt: date</text>

  <path d="M290 300 L440 230" class="line"/>
  <path d="M690 230 L840 230" class="line"/>
  <path d="M1080 230 L1220 230" class="line"/>
  <path d="M500 350 L350 470" class="line"/>
  <path d="M515 350 L780 470" class="line"/>
  <path d="M980 355 L1215 470" class="line"/>
  <path d="M340 720 L650 720" class="line"/>
  <path d="M940 720 L1120 720" class="line"/>
  <text x="330" y="205" class="label">manages</text>
  <text x="720" y="218" class="label">contains</text>
  <text x="1085" y="220" class="label">matches</text>
  <text x="395" y="430" class="label">has</text>
  <text x="590" y="440" class="label">flagged_by</text>
  <text x="1030" y="440" class="label">logs</text>
  <text x="505" y="708" class="label">applies_for</text>
  <text x="970" y="708" class="label">logs</text>
</svg>
