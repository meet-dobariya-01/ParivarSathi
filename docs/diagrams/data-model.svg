<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .entity { font: 700 16px Arial, sans-serif; fill: #111827; }
      .field { font: 500 12px Arial, sans-serif; fill: #334155; }
      .label { font: 600 13px Arial, sans-serif; fill: #475569; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="40" y="42" class="title">Data Model / ER Diagram</text>

  <rect x="60" y="110" width="230" height="190" class="box"/>
  <text x="120" y="140" class="entity">USER</text>
  <text x="80" y="170" class="field">• id: ObjectId</text>
  <text x="80" y="190" class="field">• name: string</text>
  <text x="80" y="210" class="field">• email: string</text>
  <text x="80" y="230" class="field">• passwordHash: string</text>
  <text x="80" y="250" class="field">• role: string</text>
  <text x="80" y="270" class="field">• phone: string</text>

  <rect x="440" y="110" width="250" height="240" class="box"/>
  <text x="510" y="140" class="entity">FAMILY</text>
  <text x="460" y="170" class="field">• id: ObjectId</text>
  <text x="460" y="190" class="field">• familyId: string</text>
  <text x="460" y="210" class="field">• district: string</text>
  <text x="460" y="230" class="field">• taluka: string</text>
  <text x="460" y="250" class="field">• village: string</text>
  <text x="460" y="270" class="field">• address: string</text>
  <text x="460" y="290" class="field">• annualIncome: number</text>
  <text x="460" y="310" class="field">• headMemberId: ObjectId</text>

  <rect x="840" y="110" width="240" height="245" class="box"/>
  <text x="915" y="140" class="entity">MEMBER</text>
  <text x="860" y="170" class="field">• id: ObjectId</text>
  <text x="860" y="190" class="field">• familyId: ObjectId</text>
  <text x="860" y="210" class="field">• userId: ObjectId</text>
  <text x="860" y="230" class="field">• name: string</text>
  <text x="860" y="250" class="field">• dob: date</text>
  <text x="860" y="270" class="field">• gender: string</text>
  <text x="860" y="290" class="field">• relationship: string</text>
  <text x="860" y="310" class="field">• occupation: string</text>

  <rect x="1220" y="110" width="250" height="235" class="box"/>
  <text x="1290" y="140" class="entity">SCHEME</text>
  <text x="1240" y="170" class="field">• id: ObjectId</text>
  <text x="1240" y="190" class="field">• schemeCode: string</text>
  <text x="1240" y="210" class="field">• name: string</text>
  <text x="1240" y="230" class="field">• department: string</text>
  <text x="1240" y="250" class="field">• category: string</text>
  <text x="1240" y="270" class="field">• status: string</text>
  <text x="1240" y="290" class="field">• eligibilityRules: json</text>

  <rect x="170" y="470" width="330" height="250" class="box"/>
  <text x="255" y="500" class="entity">APPLICATION</text>
  <text x="190" y="530" class="field">• id: ObjectId</text>
  <text x="190" y="550" class="field">• familyId: ObjectId</text>
  <text x="190" y="570" class="field">• memberId: ObjectId</text>
  <text x="190" y="590" class="field">• schemeId: ObjectId</text>
  <text x="190" y="610" class="field">• applicantUserId: ObjectId</text>
