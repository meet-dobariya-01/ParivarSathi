  <text x="670" y="550" class="field">• familyId: ObjectId</text>
  <text x="670" y="570" class="field">• memberId: ObjectId</text>
  <text x="670" y="590" class="field">• reason: string</text>
  <text x="670" y="610" class="field">• matchType: string</text>
  <text x="670" y="630" class="field">• similarityScore: number</text>
  <text x="670" y="650" class="field">• resolved: boolean</text>

  <rect x="1120" y="470" width="290" height="248" class="box"/>
  <text x="1200" y="500" class="entity">AUDITLOG</text>
