<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90" role="img" aria-labelledby="ps-dark-title">
  <title id="ps-dark-title">ParivarSathi — Light on Dark Lockup</title>

  <!--
    ParivarSathi Logo — Light-on-Dark Version
    For use on navy / dark backgrounds
    Shield becomes saffron-outline only · text becomes white
    Colors: Saffron #ff9933 | White #ffffff | Green #138808 (muted #2fa58a)
  -->

  <!-- Dark background bar (optional — remove if placing on existing dark bg) -->
  <rect x="0" y="0" width="360" height="90" rx="8" fill="#0f1e38"/>

  <!-- ═══ ICON — inverted: saffron shield outline, white figures ═══ -->
  <g transform="translate(5,1) scale(0.8)">
    <!-- Shield outline only -->
    <path
      d="M50 4 L94 20 L94 62 Q94 92 50 108 Q6 92 6 62 L6 20 Z"
      fill="none"
      stroke="#ff9933"
      stroke-width="5"
      stroke-linejoin="round"
    />
    <!-- Shield inner fill — very dark navy -->
    <path
      d="M50 8 L90 22 L90 62 Q90 89 50 104 Q10 89 10 62 L10 22 Z"
      fill="#0f1e38"
    />
    <!-- Top saffron stripe inside shield -->
    <path
      d="M50 8 L90 22 L90 26 L50 12 L10 26 L10 22 Z"
      fill="#ff9933"
    />
    <!-- Roof — saffron -->
    <polyline points="20,52 50,28 80,52" fill="none" stroke="#ff9933" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Centre figure — white -->
    <circle cx="50" cy="63" r="7.5" fill="#ffffff"/>
    <path d="M36 88 Q36 76 50 76 Q64 76 64 88" fill="#ffffff"/>
    <!-- Left figure — white -->
    <circle cx="31" cy="66" r="6" fill="#ffffff"/>
    <path d="M19 88 Q19 78 31 78 Q43 78 43 88" fill="#ffffff"/>
    <!-- Right figure — white -->
    <circle cx="69" cy="66" r="6" fill="#ffffff"/>
    <path d="M57 88 Q57 78 69 78 Q81 78 81 88" fill="#ffffff"/>
    <!-- ID card — teal accent -->
    <rect x="62" y="88" width="20" height="14" rx="2" fill="#2fa58a"/>
    <rect x="64" y="90" width="5" height="4" rx="0.5" fill="#ffffff"/>
    <rect x="70.5" y="90" width="9" height="1.5" rx="0.5" fill="#ffffff"/>
    <rect x="70.5" y="93" width="9" height="1.5" rx="0.5" fill="#ffffff"/>
    <rect x="64" y="96" width="16" height="1.5" rx="0.5" fill="#ffffff"/>
  </g>

  <!-- ═══ DIVIDER ═══ -->
  <line x1="90" y1="14" x2="90" y2="76" stroke="#ff9933" stroke-width="1" opacity="0.5"/>

  <!-- ═══ TEXT — white / saffron ═══ -->
  <!-- Gujarati -->
  <text
    x="102"
    y="38"
    font-family="'Noto Sans Gujarati', 'Mukta', sans-serif"
    font-size="28"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="0.5"
  >પરિવારસાથી</text>

  <!-- Saffron underline -->
  <rect x="102" y="43" width="248" height="3" rx="1.5" fill="#ff9933"/>

  <!-- English -->
  <text
    x="103"
    y="67"
    font-family="'Inter', 'Roboto', Arial, sans-serif"
    font-size="20"
    font-weight="700"
    fill="#ff9933"
    letter-spacing="1.5"
  >PARIVARSATHI</text>

  <!-- Tagline -->
  <text
    x="104"
    y="81"
    font-family="'Inter', 'Roboto', Arial, sans-serif"
    font-size="9"
    font-weight="400"
    fill="#2fa58a"
    letter-spacing="1.2"
  >FAMILY BENEFICIARY PORTAL · GUJARAT</text>
</svg>
