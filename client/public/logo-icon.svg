<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110" role="img" aria-labelledby="ps-icon-title">
  <title id="ps-icon-title">ParivarSathi — Family Beneficiary Portal Icon</title>

  <!--
    ParivarSathi Logo — Icon Only
    Colors: Navy #1a3a6b | Saffron #ff9933 | Green #138808 | White #ffffff
    No gradients · No shadows · Flat geometric
    Hand-editable SVG — © ParivarSathi Demo Project
  -->

  <!-- SHIELD body -->
  <path
    d="M50 4 L94 20 L94 62 Q94 92 50 108 Q6 92 6 62 L6 20 Z"
    fill="#1a3a6b"
  />

  <!-- ROOF / house peak (saffron, two thick lines meeting at apex) -->
  <polyline
    points="20,52 50,28 80,52"
    fill="none"
    stroke="#ff9933"
    stroke-width="7"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- THREE FIGURES — left, centre, right -->
  <!-- Centre figure (slightly taller = family head) -->
  <circle cx="50" cy="63" r="7.5" fill="#ff9933"/>
  <path d="M36 88 Q36 76 50 76 Q64 76 64 88" fill="#ff9933"/>

  <!-- Left figure (slightly smaller) -->
  <circle cx="31" cy="66" r="6" fill="#ff9933"/>
  <path d="M19 88 Q19 78 31 78 Q43 78 43 88" fill="#ff9933"/>

  <!-- Right figure (slightly smaller) -->
  <circle cx="69" cy="66" r="6" fill="#ff9933"/>
  <path d="M57 88 Q57 78 69 78 Q81 78 81 88" fill="#ff9933"/>

  <!-- ID-CARD chip — bottom right inside shield -->
  <!-- Card outline -->
  <rect x="62" y="88" width="20" height="14" rx="2" fill="#ffffff" opacity="0.95"/>
  <!-- Chip grid (green) -->
  <rect x="64" y="90" width="5" height="4" rx="0.5" fill="#138808"/>
  <rect x="70.5" y="90" width="9" height="1.5" rx="0.5" fill="#138808"/>
  <rect x="70.5" y="93" width="9" height="1.5" rx="0.5" fill="#138808"/>
  <rect x="64" y="96" width="16" height="1.5" rx="0.5" fill="#138808"/>

  <!-- SHIELD top highlight stripe (thin saffron band, gov-style) -->
  <path
    d="M50 4 L94 20 L94 24 L50 8 L6 24 L6 20 Z"
    fill="#ff9933"
    opacity="0.35"
  />
</svg>
