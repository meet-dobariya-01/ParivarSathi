<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90" role="img" aria-labelledby="ps-lockup-title">
  <title id="ps-lockup-title">ParivarSathi — પરિવારસાથી — Family Beneficiary Portal</title>

  <!--
    ParivarSathi Logo — Horizontal Lockup
    Icon left · Gujarati name top · English name bottom
    Colors: Navy #1a3a6b | Saffron #ff9933 | Green #138808
    No gradients · No shadows · Flat
  -->

  <!-- ═══ ICON (scaled to 80×88, centred in 90×90 box) ═══ -->
  <g transform="translate(5,1) scale(0.8)">
    <!-- Shield -->
    <path d="M50 4 L94 20 L94 62 Q94 92 50 108 Q6 92 6 62 L6 20 Z" fill="#1a3a6b"/>
    <!-- Roof -->
    <polyline points="20,52 50,28 80,52" fill="none" stroke="#ff9933" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Centre figure -->
    <circle cx="50" cy="63" r="7.5" fill="#ff9933"/>
    <path d="M36 88 Q36 76 50 76 Q64 76 64 88" fill="#ff9933"/>
    <!-- Left figure -->
    <circle cx="31" cy="66" r="6" fill="#ff9933"/>
    <path d="M19 88 Q19 78 31 78 Q43 78 43 88" fill="#ff9933"/>
    <!-- Right figure -->
    <circle cx="69" cy="66" r="6" fill="#ff9933"/>
    <path d="M57 88 Q57 78 69 78 Q81 78 81 88" fill="#ff9933"/>
    <!-- ID card -->
    <rect x="62" y="88" width="20" height="14" rx="2" fill="#ffffff" opacity="0.95"/>
    <rect x="64" y="90" width="5" height="4" rx="0.5" fill="#138808"/>
    <rect x="70.5" y="90" width="9" height="1.5" rx="0.5" fill="#138808"/>
    <rect x="70.5" y="93" width="9" height="1.5" rx="0.5" fill="#138808"/>
    <rect x="64" y="96" width="16" height="1.5" rx="0.5" fill="#138808"/>
    <!-- Top stripe -->
    <path d="M50 4 L94 20 L94 24 L50 8 L6 24 L6 20 Z" fill="#ff9933" opacity="0.35"/>
  </g>

  <!-- ═══ DIVIDER LINE ═══ -->
  <line x1="90" y1="14" x2="90" y2="76" stroke="#1a3a6b" stroke-width="1.5" opacity="0.25"/>

  <!-- ═══ TEXT BLOCK ═══ -->
  <!-- Gujarati name — top -->
  <text
    x="102"
    y="38"
    font-family="'Noto Sans Gujarati', 'Mukta', 'Gujarat', sans-serif"
    font-size="28"
    font-weight="700"
    fill="#1a3a6b"
    letter-spacing="0.5"
  >પરિવારસાથી</text>

  <!-- Saffron underline under Gujarati text -->
  <rect x="102" y="43" width="248" height="3" rx="1.5" fill="#ff9933"/>

  <!-- English name — bottom -->
  <text
    x="103"
    y="67"
    font-family="'Inter', 'Roboto', Arial, sans-serif"
    font-size="20"
    font-weight="700"
    fill="#1a3a6b"
    letter-spacing="1.5"
  >PARIVARSATHI</text>

  <!-- Tagline -->
  <text
    x="104"
    y="81"
    font-family="'Inter', 'Roboto', Arial, sans-serif"
    font-size="9"
    font-weight="400"
    fill="#138808"
    letter-spacing="1.2"
  >FAMILY BENEFICIARY PORTAL · GUJARAT</text>
</svg>
